    <script>
      // Universal GitHub Pages & Path Normalizer:
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // 1. If visited as /1-1 without trailing slash, redirect with slash to preserve query params and relative asset base
        if (path === '/1-1') {
          window.location.replace('/1-1/' + search + hash);
          return;
        }

        // 2. Dynamic Base Resolution for GitHub Pages subdirectory deployment (/1-1/ or /1-1/pay)
        if (window.location.hostname.endsWith('github.io') && path.indexOf('/1-1') !== -1) {
          var baseTag = document.createElement('base');
          baseTag.href = '/1-1/';
          document.head.appendChild(baseTag);
        }
      })();

      // Global early error catcher to prevent silent white screen
      window.addEventListener('error', function(event) {
        var target = event.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var src = target.src || target.href;
          console.warn('Asset load failed:', src);
          if (src && !src.includes('/1-1/') && window.location.hostname.endsWith('github.io')) {
            var newSrc = '/1-1/' + src.replace(/^[a-z]+:\/\/[^/]+\//, '');
            if (target.tagName === 'SCRIPT') {
              var s = document.createElement('script');
              s.type = 'module';
              s.crossOrigin = 'anonymous';
              s.src = newSrc;
              document.head.appendChild(s);
            }
          }
        }
      }, true);
    </script>
