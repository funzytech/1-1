<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funzy Tech</title>
    <meta name="description" content="Funzy Tech - Official Website" />
    <meta property="og:title" content="Funzy Tech" />
    <meta property="og:description" content="Funzy Tech - Official Website" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://funzytech.github.io/1-1/" />
    <meta property="og:url" content="https://funzytech.github.io/1-1/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Universal GitHub Pages & Path Normalizer:
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // 1. If visited as /1-1 without trailing slash, redirect with slash to preserve query params and relative asset base
        if (path === '/1-1') {
          window.location.replace('/1-1/' + search + hash);
          return;
        }

        // 2. Dynamic Base Resolution for GitHub Pages subdirectory deployment
        if (window.location.hostname.endsWith('github.io') && path.startsWith('/1-1')) {
          var baseTag = document.createElement('base');
          baseTag.href = '/1-1/';
          document.head.appendChild(baseTag);
        }
      })();

      // Global early error catcher to prevent silent white screen
      window.addEventListener('error', function(event) {
        var target = event.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var src = target.src || target.href;
          console.warn('Asset load failed:', src);
          if (src && !src.includes('/1-1/') && window.location.hostname.endsWith('github.io')) {
            var newSrc = '/1-1/' + src.replace(/^[a-z]+:\/\/[^/]+\//, '');
            if (target.tagName === 'SCRIPT') {
              var s = document.createElement('script');
              s.type = 'module';
              s.crossOrigin = 'anonymous';
              s.src = newSrc;
              document.head.appendChild(s);
            }
          }
        }
      }, true);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bebas+Neue&family=Cinzel:wght@700;800;900&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Oswald:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Poppins:wght@600;700&family=Sacramento&family=Satisfy&family=Space+Grotesk:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      html, body {
        background-color: #261508;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      @keyframes ftInitialCapsuleSpin {
        0% { transform: rotate(-35deg) scale(0.92); }
        50% { transform: rotate(15deg) scale(1.08); }
        100% { transform: rotate(70deg) scale(0.92); }
      }
    </style>
  </head>
  <body style="background-color: #261508; margin: 0; padding: 0;">
    <div id="root">
      <!-- FunzyTech Initial Shell (Zero-latency visual continuity) -->
      <div id="ft-initial-shell" style="position: fixed; inset: 0; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #261508; font-family: 'Outfit', -apple-system, sans-serif; color: #ffffff; overflow: hidden;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;">
          <div style="width: 36px; height: 18px; border-radius: 999px; background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #b45309 100%); transform: rotate(-35deg); box-shadow: 0 4px 20px rgba(245, 158, 11, 0.45); animation: ftInitialCapsuleSpin 1.4s ease-in-out infinite alternate;"></div>
          <div style="color: #ffffff; font-weight: 800; font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase;">FUNZY TECH</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
