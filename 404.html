<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funzy Tech</title>
    <meta name="description" content="Funzy Tech - Official Website" />
    <meta property="og:title" content="Funzy Tech" />
    <meta property="og:description" content="Funzy Tech - Official Website" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://funzytech.github.io/1-1/" />
    <meta property="og:url" content="https://funzytech.github.io/1-1/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Universal GitHub Pages & Path Normalizer:
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // 1. If visited as /1-1 without trailing slash, redirect with slash to preserve query params and relative asset base
        if (path === '/1-1') {
          window.location.replace('/1-1/' + search + hash);
          return;
        }

        // 2. Dynamic Base Resolution for GitHub Pages subdirectory deployment
        if (window.location.hostname.endsWith('github.io') && path.startsWith('/1-1')) {
          var baseTag = document.createElement('base');
          baseTag.href = '/1-1/';
          document.head.appendChild(baseTag);
        }
      })();

      // Global early error catcher to prevent silent white screen
      window.addEventListener('error', function(event) {
        var target = event.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var src = target.src || target.href;
          console.warn('Asset load failed:', src);
          if (src && !src.includes('/1-1/') && window.location.hostname.endsWith('github.io')) {
            var newSrc = '/1-1/' + src.replace(/^[a-z]+:\/\/[^/]+\//, '');
            if (target.tagName === 'SCRIPT') {
              var s = document.createElement('script');
              s.type = 'module';
              s.crossOrigin = 'anonymous';
              s.src = newSrc;
              document.head.appendChild(s);
            }
          }
        }
      }, true);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bebas+Neue&family=Cinzel:wght@700;800;900&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Oswald:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Poppins:wght@600;700&family=Sacramento&family=Satisfy&family=Space+Grotesk:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <style>html,body{background-color:#d9c4a2;margin:0;padding:0;overflow:hidden}@keyframes ftPulseGlow{0%,to{transform:scale(1);box-shadow:0 0 #d9b48266,inset 0 0 16px #fff9}50%{transform:scale(1.03);box-shadow:0 0 24px 6px #d9b4824d,inset 0 0 22px #ffffffd9}}@keyframes ftSpinSlow{0%{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes ftSparkleBreath{0%,to{opacity:.9;transform:scale(.94)rotate(0)}50%{opacity:1;transform:scale(1.1)rotate(12deg)}}@keyframes ftGoldShine{0%{background-position:-200% 0}to{background-position:200% 0}}@keyframes ftLiquidBeam{0%{width:30%;left:-35%}50%{width:45%;left:40%}to{width:30%;left:105%}}@keyframes ftBubbleRise1{0%{opacity:0;transform:translateY(0)scale(.8)}30%{opacity:.55}80%{opacity:.55}to{opacity:0;transform:translateY(-160px)scale(1.15)}}@keyframes ftBubbleRise2{0%{opacity:0;transform:translateY(0)scale(.9)}35%{opacity:.45}85%{opacity:.45}to{opacity:0;transform:translateY(-200px)scale(1.2)}}</style>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-[#d9c4a2]">
    <div id="root">
      <!-- Unique Luxury iOS 27 Liquid Glass Branded Loading Experience -->
      <div id="ft-initial-shell" style="position: fixed; inset: 0; z-index: 999999; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 42%, #fbf5ed 0%, #f4e4cf 45%, #d9c4a2 80%, #c4ab85 100%); font-family: 'Outfit', sans-serif; color: #2c1708; overflow: hidden;">
        <!-- Ambient Liquid Ambient Bubbles -->
        <div style="position: absolute; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7), rgba(217,180,130,0.15)); left: 16%; top: 65%; filter: blur(3px); animation: ftBubbleRise1 7s ease-in-out infinite;" aria-hidden="true"></div>
        <div style="position: absolute; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), rgba(217,180,130,0.12)); right: 18%; top: 72%; filter: blur(4px); animation: ftBubbleRise2 8.5s ease-in-out infinite 1.5s;" aria-hidden="true"></div>
        <div style="position: absolute; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.75), rgba(217,180,130,0.2)); left: 32%; top: 78%; filter: blur(2px); animation: ftBubbleRise1 6s ease-in-out infinite 3s;" aria-hidden="true"></div>

        <!-- Master Floating Glass Capsule -->
        <div style="position: relative; max-width: 370px; width: 88%; padding: 36px 26px 30px; background: rgba(255, 255, 255, 0.68); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-radius: 36px; border: 1.5px solid rgba(255, 255, 255, 0.9); box-shadow: 0 24px 60px -12px rgba(89, 62, 40, 0.28), 0 8px 24px -4px rgba(89, 62, 40, 0.16), inset 0 2px 4px rgba(255, 255, 255, 0.95); text-align: center;">
          
          <!-- Central Glowing Liquid Emblem -->
          <div style="position: relative; width: 78px; height: 78px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;">
            <!-- Outer liquid ring with rotating gradient -->
            <div style="position: absolute; inset: -4px; border-radius: 26px; background: linear-gradient(135deg, rgba(245, 158, 11, 0.65), rgba(255, 255, 255, 0.95), rgba(180, 83, 9, 0.5)); animation: ftSpinSlow 6s linear infinite; filter: blur(2px);"></div>
            
            <!-- Core Glass Pebble -->
            <div style="position: relative; width: 100%; height: 100%; border-radius: 24px; background: linear-gradient(145deg, #fff9f2 0%, #fae8d4 50%, #ebd4bd 100%); border: 1.5px solid rgba(255, 255, 255, 0.95); box-shadow: 0 10px 24px rgba(115, 88, 48, 0.22), inset 0 2px 4px #ffffff; display: flex; align-items: center; justify-content: center; animation: ftPulseGlow 2.8s ease-in-out infinite;">
              <!-- Animated 4-point golden starburst sparkle -->
              <svg viewBox="0 0 24 24" style="width: 40px; height: 40px; animation: ftSparkleBreath 2.4s ease-in-out infinite;">
                <defs>
                  <linearGradient id="ftGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#b45309" />
                    <stop offset="45%" stop-color="#f59e0b" />
                    <stop offset="70%" stop-color="#fbbf24" />
                    <stop offset="100%" stop-color="#78350f" />
                  </linearGradient>
                </defs>
                <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="url(#ftGoldGrad)" />
                <circle cx="12" cy="12" r="2.2" fill="#ffffff" opacity="0.95" />
              </svg>
            </div>
          </div>

          <!-- Brand Title with Golden Specular Shimmer -->
          <div style="font-family: 'Bebas Neue', 'Outfit', sans-serif; font-size: 33px; letter-spacing: 0.08em; line-height: 1; margin-bottom: 6px; background: linear-gradient(90deg, #2c1708 0%, #b45309 30%, #f59e0b 50%, #b45309 70%, #2c1708 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: ftGoldShine 3.4s linear infinite; font-weight: 900;">
            FUNZY TECH
          </div>

          <!-- Subtitle Tagline -->
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d5a3c; margin-bottom: 20px;">
            Book a 1:1 Call with Tech Creators
          </div>

          <!-- Liquid Progress Beam Track -->
          <div style="position: relative; width: 100%; height: 4px; background: rgba(89, 62, 40, 0.12); border-radius: 999px; overflow: hidden; margin-bottom: 16px;">
            <div style="position: absolute; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, #f59e0b, #d97706, #92400e); animation: ftLiquidBeam 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          </div>

          <!-- Dynamic Cycling Micro-Status Pill -->
          <div style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(255, 255, 255, 0.8); border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.95); font-size: 12px; font-weight: 600; color: #4a2c14; box-shadow: 0 2px 8px rgba(89, 62, 40, 0.06);">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; display: inline-block;"></span>
            <span id="ft-status-text" style="transition: opacity 0.25s ease;">✦ Initializing Liquid Glass...</span>
          </div>
        </div>
      </div>
      <script>
        (function() {
          var msgs = [
            '✦ Initializing Liquid Glass...',
            '✦ Connecting to Tech Creators...',
            '✦ Preparing 1:1 Workspace...',
            '✦ Crafting Consultation Experience...',
            '✦ Welcome to Funzy Tech'
          ];
          var mIdx = 0;
          var el = document.getElementById('ft-status-text');
          if (el) {
            setInterval(function() {
              mIdx = (mIdx + 1) % msgs.length;
              el.style.opacity = '0';
              setTimeout(function() {
                el.textContent = msgs[mIdx];
                el.style.opacity = '1';
              }, 220);
            }, 1900);
          }
        })();
      </script>
    </div>

    <!-- Dual-Mode Loader: Supports local Vite dev server and static GitHub Pages hosting -->
    <script>
      (function() {
        var isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (!isDev) {
          // On static hosting (like GitHub Pages), dynamically load compiled production bundle if not already present
          if (!document.querySelector('script[src*="index.js"]')) {
            var s = document.createElement('script');
            s.type = 'module';
            s.crossOrigin = 'anonymous';
            s.src = './assets/index.js';
            document.head.appendChild(s);
          }
          if (!document.querySelector('link[href*="index.css"]')) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.crossOrigin = 'anonymous';
            l.href = './assets/index.css';
            document.head.appendChild(l);
          }
        }
      })();
    </script>
  </body>
</html>
